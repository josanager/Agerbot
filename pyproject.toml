[project]
name = "agerbot"
version = "0.1.0"
description = "Un transformer diminuto y educativo entrenado desde cero."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "torch>=2.5",
  "tokenizers>=0.20",
]

[project.scripts]
agerbot-train = "agerbot.train:main"
agerbot-generate = "agerbot.generate:main"
agerbot-serve = "agerbot.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agerbot"]
